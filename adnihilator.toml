# AdNihilator Configuration

[llm]
# Enable OpenAI for LLM-based ad boundary refinement
provider = "openai"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"

[gemini]
# Enable Gemini 3.5 Flash-Lite for audio-based ad detection (google-genai SDK)
enabled = true
api_key_env = "GEMINI_API_KEY"
model = "gemini-3.5-flash-lite"
# Gemini 3+ thinking level: minimal (default for 3.5 Flash-Lite), low, medium, high.
# Not sent for pre-Gemini-3 model overrides. Sampling params (temperature/top_p/top_k)
# are deprecated for Gemini 3.5+ and intentionally not configurable.
thinking_level = "minimal"
# Use chunked detection for episodes longer than this (seconds)
# Chunked mode splits audio into 5-min chunks for more reliable detection
# Default: 1800 (30 minutes)
chunked_threshold = 1800

[detect]
# Heuristic threshold for initial candidate detection (lower = more sensitive)
heuristic_threshold = 0.4

# Context segments to include around candidates for LLM analysis
context_segments_before = 2
context_segments_after = 2

[detection]
# Enable parallel detection mode (Gemini + Whisper/keywords running simultaneously)
# When enabled, both methods run in parallel and results are merged by LLM
# When disabled (default), uses tiered detection (Gemini first, Whisper fallback)
parallel_enabled = true
